name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only reads the repo. Without this the default
# GITHUB_TOKEN is write-capable, so a compromised action tag would inherit push
# rights over the repo and its cache.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-at-least-32-chars-long
      USE_MULTI_AGENT: 'true'
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      OPENWEATHER_API_KEY: ci-openweather-key
      TOMTOM_API_KEY: ci-tomtom-key
      GOOGLE_GEMINI_API_KEY: ci-gemini-key
      UNSPLASH_ACCESS_KEY: ci-unsplash-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # No `version:` input — single source of truth is package.json
        # `packageManager` (pnpm/action-setup errors when both are set).

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        # Ratcheted budget: the tree carries a small count of unused-disable
        # warnings today. 1000 let new debt land silently; keep the ceiling
        # just above the current count and lower it as warnings are fixed.
        run: pnpm exec next lint --max-warnings=20

      - name: Dependency audit
        # Blocking gate stays at critical+prod: the repo carries 20 known high
        # advisories (mostly tarana-mobile's react-navigation/metro chain) that
        # are not reachable from the web runtime, so a blocking high gate would
        # fail on every push. Informational step below surfaces them.
        run: pnpm audit --audit-level=critical --prod

      - name: Dependency audit (informational, high)
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Lockfile hygiene
        run: node scripts/check-lockfile-integrity.mjs

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Tests
        run: pnpm test -- --coverage --passWithNoTests --maxWorkers=2

      - name: Build
        run: pnpm run build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Health smoke
        run: |
          pnpm start &
          SERVER_PID=$!
          sleep 8
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "health check OK ($STATUS)"
              kill $SERVER_PID
              exit 0
            fi
            echo "attempt $i: status $STATUS, retrying..."
            sleep 3
          done
          echo "health check FAILED after 10 attempts (last: $STATUS)"
          kill $SERVER_PID
          exit 1

  # Nothing in CI ever applied the migration chain to a fresh database, so a
  # migration that only breaks on replay — bad ordering, an undeclared
  # extension, non-idempotent DDL — was discoverable only by running it against
  # production. This replays every file in lexicographic order onto an empty
  # supabase/postgres instance and fails on the first error.
  #
  # The image is pinned to an exact tag for the same reason the actions are
  # pinned by SHA in this workflow: a floating tag would change the database
  # under the test without changing the commit.
  migration-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: supabase/postgres:15.14.1.178
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        # Postgres listens on 5432 *inside* this image; 54322 is only the host
        # port `supabase start` chooses to publish it on. Mapping 54322:54322
        # pointed the host port at nothing while the container-side health
        # check still passed, so the first run failed at connect, not at SQL.
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Migration file hygiene
        run: node scripts/check-migration-hygiene.mjs

      - name: Replay every migration onto an empty database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=54322 PGUSER=postgres PGDATABASE=postgres
          total=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            total=$((total + 1))
            echo "::group::[$total] $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
          echo "replayed $total migration(s)"

      - name: Assert the replay produced the expected schema
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=54322 PGUSER=postgres PGDATABASE=postgres
          # A migration that silently does nothing still exits 0, so assert the
          # two objects this chain is known to produce: the base table, and the
          # column added by the newest migration.
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.tables where table_schema='public' and table_name in ('users','saved_meals')" \
            | grep -qx 2 || { echo "expected users + saved_meals to exist after replay"; exit 1; }
          psql -v ON_ERROR_STOP=1 -tAc \
            "select count(*) from information_schema.columns where table_schema='public' and table_name='users' and column_name='password_changed_at'" \
            | grep -qx 1 || { echo "users.password_changed_at missing after replay"; exit 1; }
          echo "schema assertions passed"

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-at-least-32-chars-long
      USE_MULTI_AGENT: 'true'
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      OPENWEATHER_API_KEY: ci-openweather-key
      TOMTOM_API_KEY: ci-tomtom-key
      GOOGLE_GEMINI_API_KEY: ci-gemini-key
      UNSPLASH_ACCESS_KEY: ci-unsplash-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lockfile hygiene
        run: node scripts/check-lockfile-integrity.mjs

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke journey
        run: pnpm run test:e2e
