name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-at-least-32-chars-long
      USE_MULTI_AGENT: 'true'
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      OPENWEATHER_API_KEY: ci-openweather-key
      TOMTOM_API_KEY: ci-tomtom-key
      GOOGLE_GEMINI_API_KEY: ci-gemini-key
      UNSPLASH_ACCESS_KEY: ci-unsplash-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No `version:` input — single source of truth is package.json
        # `packageManager` (pnpm/action-setup errors when both are set).

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec next lint --max-warnings=1000

      - name: Dependency audit
        run: pnpm audit --audit-level=critical --prod

      - name: Lockfile hygiene
        run: node scripts/check-lockfile-integrity.mjs

      - name: Typecheck
        run: npx tsc --noEmit --skipLibCheck

      - name: Tests
        run: pnpm test -- --coverage --passWithNoTests --maxWorkers=2

      - name: Build
        run: pnpm run build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Health smoke
        run: |
          pnpm start &
          SERVER_PID=$!
          sleep 8
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "health check OK (200)"
              kill $SERVER_PID
              exit 0
            fi
            echo "attempt $i: status $STATUS, retrying..."
            sleep 3
          done
          echo "health check FAILED after 10 attempts (last: $STATUS)"
          kill $SERVER_PID
          exit 1

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-at-least-32-chars-long
      USE_MULTI_AGENT: 'true'
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      OPENWEATHER_API_KEY: ci-openweather-key
      TOMTOM_API_KEY: ci-tomtom-key
      GOOGLE_GEMINI_API_KEY: ci-gemini-key
      UNSPLASH_ACCESS_KEY: ci-unsplash-key
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lockfile hygiene
        run: node scripts/check-lockfile-integrity.mjs

      - name: Build
        run: pnpm run build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke journey
        run: pnpm run test:e2e
